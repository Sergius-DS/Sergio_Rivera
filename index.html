<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sergio Rivera | ML-Systems-Engineer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0e14;
    color: #b3b1ad;
    font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    padding: 20px;
    line-height: 1.5;
    min-height: 100vh;
  }
  #terminal {
    max-width: 900px;
    margin: 0 auto;
    background: #010306;
    border: 1px solid #1f2329;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 0 30px rgba(52, 211, 153, 0.08);
  }
  .header {
    color: #34d399;
    border-bottom: 1px solid #1f2329;
    padding-bottom: 10px;
    margin-bottom: 15px;
    font-size: 0.85rem;
  }
  .prompt { color: #34d399; }
  .user { color: #f59e0b; }
  .path { color: #60a5fa; }
  #output { margin-bottom: 10px; }
  .line { white-space: pre-wrap; margin-bottom: 8px; word-wrap: break-word; }
  .cmd-echo { color: #e5e7eb; }
  .error { color: #f87171; }
  .highlight { color: #34d399; font-weight: bold; }
  .info { color: #60a5fa; }
  .warn { color: #fbbf24; }
  .input-line { display: flex; align-items: center; }
  #cmd {
    background: transparent;
    border: none;
    color: #e5e7eb;
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    flex: 1;
    margin-left: 5px;
    caret-color: #34d399;
  }
  .blink { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .tree { color: #9ca3af; }
  .metric-num { color: #fbbf24; font-weight: bold; }
  @media (max-width: 600px) {
    body { padding: 10px; font-size: 0.85rem; }
    #terminal { padding: 12px; }
  }
</style>
</head>
<body>
<div id="terminal">
  <div class="header">
    <span class="info">sergio@ml-systems</span>
    <span style="color:#9ca3af">:~$ </span>
    <span style="color:#9ca3af">[session started | type </span>
    <span class="highlight">help</span>
    <span style="color:#9ca3af"> to begin]</span>
  </div>
  <div id="output"></div>
  <div class="input-line">
    <span class="prompt">sergio@ml-systems</span>
    <span style="color:#9ca3af">:</span>
    <span class="path">~</span>
    <span style="color:#9ca3af">$</span>
    <input type="text" id="cmd" autocomplete="off" spellcheck="false" autofocus>
  </div>
</div>

<script>
const output = document.getElementById('output');
const input = document.getElementById('cmd');
const history = [];
let histIdx = -1;

// CV URL (reusable)
const CV_URL = 'https://raw.githubusercontent.com/Sergius-DS/Sergio_Rivera/main/Sergio_F_Rivera_B.pdf';
const CV_FILENAME = 'Sergio_F_Rivera_B.pdf';

// Helper function to trigger automatic download
function triggerDownload(url, filename) {
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Semantic color palette
const color = {
  g: '#34d399', b: '#60a5fa', y: '#fbbf24', r: '#f87171', w: '#e5e7eb', d: '#9ca3af'
};

function c(text, col) { return `<span style="color:${col}">${text}</span>`; }

const commands = {
  help: () => `
${c('AVAILABLE COMMANDS', color.g)}
${c('──────────────────────────────', color.d)}
  ${c('whoami', color.b)}     Professional identity
  ${c('problem', color.b)}    The bottleneck I solve
  ${c('stack', color.b)}      Complete tech stack
  ${c('metrics', color.b)}    Real production benchmarks
  ${c('projects', color.b)}   Featured projects
  ${c('origin', color.b)}     My background in critical networks
  ${c('philosophy', color.b)} Engineering principles
  ${c('contact', color.b)}    Contact channels
  ${c('install', color.b)}    How to integrate into the team
  ${c('wget cv', color.b)}    Download CV automatically
  ${c('clear', color.b)}      Clear terminal
  ${c('source', color.b)}     View source code

Tip: ${c('↑/↓', color.y)} for history, ${c('Tab', color.y)} for autocomplete.`,

  whoami: () => `
${c('👤 SERGIO FRANCISCO RIVERA BUSTAMANTE', color.g)}
${c('ML-Systems-Engineer', color.b)}

"${c('Models die in Jupyter Notebooks. I build the infrastructure so they can survive in the metal.', color.w)}"`,

  problem: () => `
${c('⚠️  THE PROBLEM', color.r)}
${c('──────────────────────────────', color.d)}
Data Science in production has an ${c('invisible', color.y)} bottleneck:

  • Heap fragmentation in ${c('CPython', color.r)}
  • Inefficient inference
  • Pipelines that saturate RAM
  • Uncontrolled cloud costs

Optimizing accuracy by ${c('+2%', color.y)} is useless if the pipeline drives up computing costs.`,

  stack: () => `
${c('📦 CORE DEPENDENCIES', color.g)}
${c('──────────────────────────────', color.d)}

${c('Bare-Metal & Performance', color.b)}
  <span class="tree">├──</span> Rust, PyO3
  <span class="tree">├──</span> SIMD (AVX2/SSE)
  <span class="tree">└──</span> Zero-Copy

${c('Orchestration & Backend', color.b)}
  <span class="tree">├──</span> Python, Axum, FastAPI
  <span class="tree">├──</span> Tokio
  <span class="tree">└──</span> ZenML

${c('Infrastructure & SRE', color.b)}
  <span class="tree">├──</span> K8s, Prometheus
  <span class="tree">├──</span> CI/CD
  <span class="tree">└──</span> SSH, AI Agents`,

  metrics: () => `
${c('📊 PRODUCTION BENCHMARKS', color.g)}
${c('(real numbers, not promises)', color.d)}
${c('──────────────────────────────', color.d)}

${c('🧠 Memory Optimization', color.b)}
   <span class="metric-num">87%</span> RSS reduction
   ${c('3.93 MB → 0.50 MB', color.y)} in vision pipelines
   Stack: fast_image_resize + PyO3

${c('⏱️  Latency', color.b)}
   <span class="metric-num">&lt;5ms p99</span> in SRE alert validation
   Native engine in Rust

${c('🚀 Throughput', color.b)}
   <span class="metric-num">+10,000</span> alerts/sec asynchronous ingestion
   Stack: Axum + Tokio

${c('✅ Integrity', color.b)}
   MSE <span class="metric-num">3.37e-05</span>
   Certified numerical equivalence
   ResNet50 for clinical environments`,

  projects: () => `
${c('🗂️ FEATURED PROJECTS', color.g)}
${c('──────────────────────────────', color.d)}

${c('[1] Optimized Clinical ResNet50', color.b)}
    • Certified numerical equivalence (MSE 3.37e-05)
    • 87% RSS memory reduction
    • Suitable for regulated clinical environments

${c('[2] Native SRE Engine in Rust', color.b)}
    • Latency <5ms p99
    • Validates +10k alerts/second
    • Zero-copy in critical pipelines

${c('[3] Zero-Copy Vision Pipeline', color.b)}
    • PyO3 + fast_image_resize
    • SIMD AVX2/SSE for inference
    • 87% less memory vs. pure Python`,

  origin: () => `
${c('⚙️ SYSTEM ARCHITECTURE (My Background)', color.g)}
${c('──────────────────────────────', color.d)}

${c('Foundation:', color.b)} Critical Network Engineering
             CCNP, Juniper

${c('Mindset:', color.b)} Latency, concurrency, high availability

${c('Today:', color.b)} I apply SRE mindset to Machine Learning
          at the intersection: ${c('experimentation ↔ bare-metal', color.y)}`,

  philosophy: () => `
${c('🎯 ENGINEERING PHILOSOPHY', color.g)}
${c('──────────────────────────────', color.d)}

1. Production code must be ${c('measurable', color.y)}, not magical.

2. Efficiency is a ${c('feature', color.y)}, not an optimization.

3. Models without infrastructure are ${c('prototypes', color.r)},
   not products.

4. The most dangerous bottleneck is the one
   you ${c('cannot observe', color.r)}.`,

  contact: () => `
${c('📡 CONTACT CHANNELS', color.g)}
${c('──────────────────────────────', color.d)}

  Email:    ${c('[sergioskhy@gmail.com]', color.b)}
  GitHub:   ${c('[github.com/Sergius-DS]', color.b)}
  LinkedIn: ${c('[linkedin.com/in/sergio-francisco-rivera-bustamante]', color.b)}`,

  install: () => `
${c('💻 INSTALLATION', color.g)}
${c('──────────────────────────────', color.d)}

  ${c('$', color.d)} cargo build --release

${c('✓', color.g)} Ready to reduce cloud costs
${c('✓', color.g)} Automate SRE with AI Agents
${c('✓', color.g)} Ship models to real production`,

  source: () => `
${c('📄 SOURCE CODE', color.g)}
${c('──────────────────────────────', color.d)}

This terminal is ${c('100% Vanilla JS', color.y)} — zero dependencies.

  • DOM performance
  • No framework runtime overhead
  • Build = ${c('0 bytes', color.y)} of external JavaScript

The web equivalent of a ${c('Rust-compiled binary', color.b)}.

Repository: ${c('github.com/Sergius-DS/Sergio_Rivera', color.b)}`,

  clear: () => { output.innerHTML = ''; return null; },

  'wget cv': () => {
    // Trigger automatic download after a short delay for visual feedback
    setTimeout(() => triggerDownload(CV_URL, CV_FILENAME), 600);

    return `
${c('📥 STARTING DOWNLOAD...', color.g)}
${c('──────────────────────────────', color.d)}
${c('$', color.d)} wget ${CV_URL}

${c('Connecting to raw.githubusercontent.com...', color.y)}
${c('✓', color.g)} TLS handshake complete
${c('✓', color.g)} HTTP/2 200 OK
${c('✓', color.g)} Saving: ${c(CV_FILENAME, color.b)}

${c('Check your downloads folder.', color.y)}`;
  },

  sudo: () => `
${c('❌ Permission denied', color.r)}
Nice try. This system is read-only.`,

  ls: () => `
${c('drwxr-xr-x', color.d)} portfolio/
${c('drwxr-xr-x', color.d)} benchmarks/
${c('-rw-r--r--', color.d)} cv_sergio_rivera.pdf
${c('-rw-r--r--', color.d)} resnet50_clinical_benchmark.json`,

  cat: () => `${c('Usage:', color.y)} cat [filename]\nTry: ${c('cat cv_sergio_rivera.pdf', color.b)}`,

  'cat cv_sergio_rivera.pdf': () => `
${c('📄 cv_sergio_rivera.pdf', color.g)}
${c('──────────────────────────────', color.d)}
Direct download (click): <a href="${CV_URL}" download="${CV_FILENAME}" style="color:${color.b}; text-decoration: underline; cursor: pointer;">${CV_FILENAME}</a>

Or use: ${c('wget cv', color.g)} for automatic download.

Content: ${c('1 page', color.y)} | ${c('Real metrics', color.y)} | ${c('No empty buzzwords', color.y)}`,

  exit: () => `
${c('⚠️  There is no escape from this system.', color.y)}
Models die in Jupyter. I build the infrastructure.
Type ${c('help', color.g)} to continue exploring.`
};

function print(html) {
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = html;
  output.appendChild(div);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function execute(cmd) {
  const c = cmd.trim().toLowerCase();
  if (!c) return;

  // Command echo
  print(`<span class="prompt">sergio@ml-systems</span><span style="color:${color.d}">:</span><span class="path">~</span><span style="color:${color.d}">$</span> <span class="cmd-echo">${cmd}</span>`);

  // Save history
  if (history[history.length - 1] !== cmd) history.push(cmd);
  histIdx = history.length;

  // Execute
  if (commands[c]) {
    const result = commands[c]();
    if (result) print(result);
  } else if (c.startsWith('run ')) {
    const sub = c.substring(4);
    if (commands[sub]) {
      const result = commands[sub]();
      if (result) print(result);
    } else {
      print(`<span class="error">run: target "${sub}" not found. Type "help".</span>`);
    }
  } else {
    print(`<span class="error">command not found: ${c}</span>\n<span style="color:${color.d}">Type </span><span class="highlight">help</span><span style="color:${color.d}"> for available commands.</span>`);
  }
}

// Input
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    execute(input.value);
    input.value = '';
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
    else { histIdx = history.length; input.value = ''; }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const matches = Object.keys(commands).filter(k => k.startsWith(input.value.toLowerCase()));
    if (matches.length === 1) input.value = matches[0];
    else if (matches.length > 1) print(`Suggestions: ${matches.join(', ')}`);
  }
});

// Always keep focus on input
document.addEventListener('click', () => input.focus());

// Boot sequence
window.addEventListener('load', () => {
  setTimeout(() => {
    print(`<span class="info">[boot]</span> ML-Systems terminal v1.0.0`);
    print(`<span class="info">[boot]</span> Kernel: Vanilla JS | Build: static`);
    print(`<span class="info">[boot]</span> ${c('Ready.', color.g)} Type ${c('help', color.y)} to explore Sergio's profile.\n`);
  }, 200);
});
</script>
</body>
</html>
